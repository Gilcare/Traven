<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Aidex — Traven</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; padding: 24px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 40px 24px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 380px; width: 100%; text-align: center; }
    .lock { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 22px; color: #111827; margin-bottom: 8px; }
    p { color: #6b7280; line-height: 1.5; margin-bottom: 24px; font-size: 15px; }
    button { background: #25d366; color: white; border: none; padding: 16px; width: 100%; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:active { transform: scale(0.98); }
    .small { margin-top: 16px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
