services:
  - type: web
    name: traven-aidex-connect
    runtime: python
    plan: free
    rootDir: aidex-connect   # <-- ADD THIS LINE
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT  # <-- SIMPLIFIED (because rootDir moves us inside the folder)
    healthCheckPath: /health
    envVars:
      - key: BASE_URL
        value: https://traven-aidex-connect.onrender.com
      - key: AIDEX_BASE_URL
        value: https://aidexapi.microtechmd.com
      - key: MONGO_DB
        value: traven
      - key: AIDEX_CLIENT_ID
        sync: false
      - key: AIDEX_CLIENT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: TOKEN_KEY
        sync: false
      - key: TRAVEN_WEBHOOK_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false

